<div class="container">
  <div class="booking-card">
    <h2>PRASAD BOOKING</h2>
    <p>Feel the presence of the divine in every bite.</p>

    <form #form="ngForm" (ngSubmit)="submitForm(form)" novalidate>

      <!-- Date -->
      <div class="form-group">
        <i class="fa fa-calendar"></i>
        <input type="date" name="date" [(ngModel)]="booking.date" [min]="today" required (change)="checkAvailability()"
          #date="ngModel" />
        <div class="error" *ngIf="date.invalid && date.touched">
          Please select a valid date.
        </div>
      </div>

      <!-- Time Slot -->
      <div class="form-group">
        <i class="fa fa-clock"></i>
        <select name="timeSlot" [(ngModel)]="booking.timeSlot" required (change)="checkAvailability()"
          #timeSlot="ngModel">
          <option value="" disabled [selected]="!booking.timeSlot">Select Time Slot</option>
          <option value="6AM-8AM">6AM - 8AM</option>
          <option value="8AM-10AM">8AM - 10AM</option>
          <option value="5PM-7PM">5PM - 7PM</option>
        </select>
        <div class="error" *ngIf="timeSlot.invalid && timeSlot.touched">
          Please select a time slot.
        </div>
      </div>

      <!-- Slot Availability -->
      <div class="form-group">
        <span *ngIf="availableSlots !== null" class="availability-text">
          Available Slots: {{ availableSlots }} / 150
        </span>
      </div>

      <!-- Number of People -->
      <div class="form-group">
        <i class="fa fa-users"></i>
        <input type="number" name="numberOfPeople" [(ngModel)]="booking.noOfPeople" min="1" max="10"
          placeholder="No. of People" required #numberOfPeople="ngModel" />
        <div class="error" *ngIf="numberOfPeople.invalid && numberOfPeople.touched">
          You can book for up to 10 people at a time.
        </div>
      </div>

      <br />

      <!-- Optional Donation -->
      <div class="form-group">
        <i class="fa fa-inr"></i>
        <input type="number" name="donation" [(ngModel)]="booking.donation" min="0"
          placeholder="Additional Donation Amount (Optional)" />
      </div>

      <!-- Optional Notes -->
      <div class="form-group">
        <i class="fa fa-comment"></i>
        <textarea name="message" [(ngModel)]="booking.message" rows="3" placeholder="Any message (optional)"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">
        <i class="fa fa-check-circle"></i> Book Prasad
      </button>
    </form>
  </div>
</div>
